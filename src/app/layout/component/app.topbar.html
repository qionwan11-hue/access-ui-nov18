<div class="layout-topbar">
    <div class="layout-topbar-logo-container">
        <button class="layout-menu-button layout-topbar-action" (click)="layoutService.onMenuToggle()">
            <i class="pi pi-bars"></i>
        </button>
        <a class="layout-topbar-logo" routerLink="/">
            <span><img src="assets/demo/images/logo/TAF.png" alt="Logo" class="logo-image-after-login mr-2"></span>
            <span>{{ userName }}</span>
        </a>
    </div>

    <div class="layout-topbar-actions topbar-right-actions">
        <button
            type="button"
            class="layout-topbar-action topbar-icon-btn"
            [attr.aria-label]="layoutService.isDarkTheme() ? ('Light mode' | translate) : ('Dark mode' | translate)"
            (click)="toggleDarkMode()">
            <i [ngClass]="{ 'pi': true, 'pi-moon': layoutService.isDarkTheme(), 'pi-sun': !layoutService.isDarkTheme() }"></i>
        </button>
        <button
            type="button"
            class="layout-topbar-action topbar-profile-trigger"
            (click)="openProfile()"
            [attr.aria-label]="'Profile' | translate">
            <span class="topbar-profile-avatar" aria-hidden="true">
                <i class="pi pi-user"></i>
            </span>
        </button>
    </div>
</div>

<p-dialog header="Confirmation" [(visible)]="displayConfirmation" [style]="{ width: '350px' }" [modal]="true">
    <div class="flex items-center justify-center">
        <i class="pi pi-exclamation-triangle mr-4" style="font-size: 2rem"></i>
        <span>{{ 'Are you sure you want to logout?' | translate }}</span>
    </div>
    <ng-template #footer>
        <p-button label="{{ 'No' | translate }}" icon="pi pi-times" (click)="closeConfirmation()" text severity="secondary" />
        <p-button label="{{ 'Yes' | translate }}" icon="pi pi-check" (click)="logOutConfirmation()" severity="danger" outlined autofocus />
    </ng-template>
</p-dialog>

<p-drawer
    [(visible)]="showProfileDrawer"
    position="right"
    [modal]="true"
    [dismissible]="true"
    [showCloseIcon]="true"
    styleClass="profile-drawer !w-full sm:!w-[380px]">

    <ng-template pTemplate="header">
        <span class="font-semibold text-lg">{{ 'My Account' | translate }}</span>
    </ng-template>

    <div class="profile-drawer-body flex flex-col gap-5">
        <div class="profile-drawer-hero rounded-xl p-4 bg-surface-50 dark:bg-surface-800 border border-surface-200 dark:border-surface-700">
            <div class="flex items-center gap-3">
                <div class="profile-drawer-hero-avatar shrink-0">
                    <i class="pi pi-user"></i>
                </div>
                <div class="min-w-0 flex-1">
                    <div class="font-semibold text-base leading-tight text-surface-900 dark:text-surface-0 truncate">
                        {{ userName || '—' }}
                    </div>
                    <div class="mt-0.5 text-sm leading-tight text-surface-500 dark:text-surface-400 truncate">
                        {{ userEmail || '—' }}
                    </div>
                </div>
            </div>
        </div>

        <section class="profile-drawer-section">
            <h3 class="profile-drawer-section-title">{{ 'Account' | translate }}</h3>
            <ul class="profile-drawer-list">
                <li class="profile-drawer-row">
                    <span class="profile-drawer-row-label">{{ 'UID' | translate }}</span>
                    <span class="profile-drawer-row-value">{{ userUid || '—' }}</span>
                </li>
            </ul>
        </section>

        <section class="profile-drawer-section">
            <h3 class="profile-drawer-section-title">{{ 'Settings' | translate }}</h3>
            <ul class="profile-drawer-list">
                <li class="profile-drawer-action-row profile-drawer-action-row--clickable">
                    <button
                        type="button"
                        class="profile-drawer-logout-btn"
                        (click)="openConfirmation()">
                        <span class="profile-drawer-action-icon profile-drawer-action-icon--danger">
                            <i class="pi pi-sign-out"></i>
                        </span>
                        <div class="text-left min-w-0 flex-1">
                            <div class="text-sm font-medium text-red-500">{{ 'Logout' | translate }}</div>
                        </div>
                    </button>
                </li>
            </ul>
        </section>
    </div>
</p-drawer>
